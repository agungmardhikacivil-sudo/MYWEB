            var filterTabs = document.getElementById('filterTabs');
            var detailContent = document.getElementById('detailContent');
            var backBtn = document.getElementById('backToList');
            var brandHome = document.getElementById('brandHome');
            var articleCount = document.getElementById('articleCount');
            var searchInput = document.getElementById('searchInput');
            var searchClear = document.getElementById('searchClear');
            var prevPageBtn = document.getElementById('prevPage');
            var nextPageBtn = document.getElementById('nextPage');
            var pageInfo = document.getElementById('pageInfo');
            var pageNumbers = document.getElementById('pageNumbers');

            // Elemen counter dan menu (slide navigasi)
            var currEl = document.getElementById('curr');
            var totalEl = document.getElementById('total');
            var menuCurrEl = document.getElementById('menuCurr');
            var menuTotalEl = document.getElementById('menuTotal');
            var sectionEl = document.getElementById('sectionName');
            var prevBtn = document.getElementById('prev');
            var nextBtn = document.getElementById('next');
            var menuBtn = document.getElementById('menuBtn');
            var menuOverlay = document.getElementById('menuOverlay');
            var menuPanel = document.getElementById('menuPanel');
            var menuList = document.getElementById('menuList');
            var menuItems = menuList.querySelectorAll('.menu-item');

            var idx = 0,
                isAnimating = false,
                menuOpen = false;
            var currentFilter = 'all';
            var currentSearch = '';
            var currentPage = 1;
            var itemsPerPage = 20;
            var filteredArticles = [];

            totalEl.textContent = String(slides.length).padStart(2, '0');
            menuTotalEl.textContent = String(slides.length).padStart(2, '0');

            // ---- navigasi slide ----
            function go(t) {
                if (isAnimating || t === idx || t < 0 || t >= slides.length) return;
                isAnimating = true;
                var old = slides[idx],
                    next = slides[t];
                old.classList.add('exiting');
                old.classList.remove('active');
                setTimeout(function() {
                    next.classList.add('active');
                    next.scrollTop = 0;
                    old.classList.remove('exiting');
                    idx = t;
                    var n = String(idx + 1).padStart(2, '0');
                    currEl.textContent = n;
                    menuCurrEl.textContent = n;
                    sectionEl.textContent = next.dataset.section || 'Artikel';
                    menuItems.forEach(function(el, i) {
                        el.classList.toggle('current', i === idx);
                    });
                    if (t === 0) applyFiltersAndRender();
                    setTimeout(function() { isAnimating = false }, 900);
                }, 350);
            }

            // ---- filter & render ----
            function applyFiltersAndRender() {
                var searchTerm = currentSearch.trim().toLowerCase();
                filteredArticles = ARTICLES.filter(function(a) {
                    var matchCat = (currentFilter === 'all' || a.category === currentFilter);
                    var matchSearch = true;
                    if (searchTerm) {
                        matchSearch = a.title.toLowerCase().includes(searchTerm) ||
                            a.excerpt.toLowerCase().includes(searchTerm) ||
                            a.content.toLowerCase().includes(searchTerm);
                    }
                    return matchCat && matchSearch;
                });
                currentPage = 1;
                renderPage(currentPage);
            }

            function renderPage(page) {
                var totalItems = filteredArticles.length;
                var totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
                if (page < 1) page = 1;
                if (page > totalPages) page = totalPages;
                currentPage = page;

                var start = (page - 1) * itemsPerPage;
                var end = Math.min(start + itemsPerPage, totalItems);
                var pageItems = filteredArticles.slice(start, end);

                articleCount.textContent = totalItems + ' artikel';

                if (totalItems === 0) {
                    grid.innerHTML =
                        '<div class="empty-state"><div class="empty-icon">🔍</div><p>Tidak ditemukan artikel yang cocok.</p></div>';
                } else {
                    var html = '';
                    pageItems.forEach(function(a) {
                        var catClass = '';
                        if (a.category === 'Procurement') catClass = 'cat-procurement';
                        else if (a.category === 'Civil Engineering / Building Technology') catClass = 'cat-civil';
                        else if (a.category === 'News and Media Assessment') catClass = 'cat-media';
                        else if (a.category === 'Agung\'s Chronicles') catClass = 'cat-chronicles';

                        html += `
                            <div class="article-card glass-card reveal" data-id="${a.id}">
                                <div class="ac-top">
                                    <div class="ac-icon">${a.icon || '📄'}</div>
                                    <span class="ac-cat ${catClass}">${a.category}</span>
                                </div>
                                <h3>${a.title}</h3>
                                <div class="ac-excerpt">${a.excerpt}</div>
                                <div class="ac-meta">
                                    <span>${a.date || ''}</span>
                                    <span class="ac-read">Baca selengkapnya →</span>
                                </div>
                            </div>
                        `;
                    });
                    grid.innerHTML = html;

                    grid.querySelectorAll('.article-card').forEach(function(card) {
                        card.addEventListener('click', function() {
                            var id = parseInt(this.dataset.id, 10);
                            openDetail(id);
                        });
                    });

                    grid.querySelectorAll('.reveal').forEach(function(el, i) {
                        el.style.transitionDelay = (0.4 + i * 0.08) + 's';
                    });
                }

                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                prevPageBtn.disabled = (currentPage <= 1);
                nextPageBtn.disabled = (currentPage >= totalPages);
                pageInfo.textContent = 'Halaman ' + currentPage + ' / ' + totalPages;

                var maxVisible = 7;
                var startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                var endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                var html = '';
                if (startPage > 1) {
                    html += '<button data-page="1">1</button>';
                    if (startPage > 2) html += '<span style="color:var(--ink-4);padding:0 4px;">…</span>';
                }
                for (var p = startPage; p <= endPage; p++) {
                    var activeClass = (p === currentPage) ? 'active' : '';
                    html += '<button data-page="' + p + '" class="' + activeClass + '">' + p + '</button>';
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += '<span style="color:var(--ink-4);padding:0 4px;">…</span>';
                    html += '<button data-page="' + totalPages + '">' + totalPages + '</button>';
                }
                pageNumbers.innerHTML = html;

                pageNumbers.querySelectorAll('button[data-page]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var page = parseInt(this.dataset.page, 10);
                        if (page !== currentPage) {
                            renderPage(page);
                        }
                    });
                });
            }

            // ---- buka detail ----
            function openDetail(id) {
                var article = ARTICLES.find(function(a) { return a.id === id; });
                if (!article) return;
                renderDetail(article);
                go(1);
            }

            function renderDetail(article) {
                var catClass = '';
                if (article.category === 'Procurement') catClass = 'cat-procurement';
                else if (article.category === 'Civil Engineering / Building Technology') catClass = 'cat-civil';
                else if (article.category === 'News and Media Assessment') catClass = 'cat-media';
                else if (article.category === 'Agung\'s Chronicles') catClass = 'cat-chronicles';

                var shareUrl = window.location.href.split('?')[0] + '?article=' + article.id;
                var shareText = encodeURIComponent(article.title + ' — ' + article.excerpt + '  Baca selengkapnya di: ' +
                    shareUrl);

                detailContent.innerHTML = `
                    <div class="dc-head">
                        <span class="dc-cat ${catClass}">${article.category}</span>
                        <h1>${article.title}</h1>
                        <div class="dc-date">${article.date || ''}</div>
                    </div>
                    <div class="dc-body">
                        ${article.content}
                    </div>
                    <div class="share-row">
                        <span class="share-label">📤 Bagikan artikel</span>
                        <a class="share-btn email" href="mailto:?subject=${encodeURIComponent(article.title)}&body=${encodeURIComponent(article.title + '\n\n' + article.excerpt + '\n\nBaca selengkapnya: ' + shareUrl)}" target="_blank" rel="noopener">
                            ✉️ Email
                        </a>
                        <a class="share-btn whatsapp" href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" rel="noopener">
                            💬 WhatsApp
                        </a>
                    </div>
                `;
                var slide = document.getElementById('slideDetail');
                if (slide) slide.scrollTop = 0;
            }

            // ---- event listeners ----
            filterTabs.addEventListener('click', function(e) {
                var btn = e.target.closest('.ft');
                if (!btn) return;
                filterTabs.querySelectorAll('.ft').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                if (idx === 0) applyFiltersAndRender();
            });

            function handleSearch() {
                var term = searchInput.value;
                currentSearch = term;
                if (term.trim() === '') searchClear.classList.remove('visible');
                else searchClear.classList.add('visible');
                if (idx === 0) applyFiltersAndRender();
            }
            searchInput.addEventListener('input', handleSearch);
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                handleSearch();
                searchInput.focus();
            });

            prevPageBtn.addEventListener('click', function() {
                if (currentPage > 1) renderPage(currentPage - 1);
            });
            nextPageBtn.addEventListener('click', function() {
                var totalPages = Math.ceil(filteredArticles.length / itemsPerPage) || 1;
                if (currentPage < totalPages) renderPage(currentPage + 1);
            });

            backBtn.addEventListener('click', function() { go(0); });
            brandHome.addEventListener('click', function() { go(0); });

            // ---- menu ----
            function openMenu() { menuOpen = true;
                menuOverlay.classList.add('open');
                menuPanel.classList.add('open');
                menuBtn.classList.add('open'); }

            function closeMenu() { menuOpen = false;
                menuOverlay.classList.remove('open');
                menuPanel.classList.remove('open');
                menuBtn.classList.remove('open'); }

            function toggleMenu() { menuOpen ? closeMenu() : openMenu(); }

            menuBtn.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', closeMenu);

            menuItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    var slideIdx = parseInt(this.dataset.slide, 10);
                    if (!isNaN(slideIdx)) go(slideIdx);
                    closeMenu();
                });
            });

            prevBtn.addEventListener('click', function() { go(idx - 1); });
            nextBtn.addEventListener('click', function() { go(idx + 1); });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && menuOpen) { closeMenu(); return; }
                if (menuOpen) return;
                if (e.key === 'ArrowRight') go(idx + 1);
                if (e.key === 'ArrowLeft') go(idx - 1);
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault();
                    go(idx + 1); }
                if (e.key === 'm' || e.key === 'M') toggleMenu();
                if (e.key === '1') go(0);
                if (e.key === '2') go(1);
            });

            var tx = 0,
                ty = 0,
                scrolling = false;
            document.addEventListener('touchstart', function(e) {
                tx = e.touches[0].clientX;
                ty = e.touches[0].clientY;
                scrolling = false;
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                var dx = Math.abs(e.touches[0].clientX - tx);
                var dy = Math.abs(e.touches[0].clientY - ty);
                if (dy > dx) scrolling = true;
            }, { passive: true });
            document.addEventListener('touchend', function(e) {
                if (scrolling || menuOpen) return;
                var dx = e.changedTouches[0].clientX - tx;
                var dy = Math.abs(e.changedTouches[0].clientY - ty);
                if (Math.abs(dx) > 60 && dy < 40) dx < 0 ? go(idx + 1) : go(idx - 1);
            }, { passive: true });

            // ---- inisialisasi ----
            (function() {
                var params = new URLSearchParams(window.location.search);
                var articleId = params.get('article');
                if (articleId) {
                    var id = parseInt(articleId, 10);
                    if (!isNaN(id) && ARTICLES.some(function(a) { return a.id === id; })) {
                        applyFiltersAndRender();
                        openDetail(id);
                    }
                } else {
                    applyFiltersAndRender();
                }
            })();

            menuItems.forEach(function(el, i) {
                el.classList.toggle('current', i === 0);
            });

        })();
    </script>

</body>
</html>
