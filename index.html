<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agung Mardhika's Page — Artikel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
                   ROOT & RESET — tetap sama seperti tema awal
                   ============================================================ */
        :root {
            --ee: cubic-bezier(0.19, 1, 0.22, 1);
            --eq: cubic-bezier(0.77, 0, 0.175, 1);
            --es: cubic-bezier(0.34, 1.56, 0.64, 1);
            --bg: #0a0e1a;
            --bg-2: #0d1220;
            --ink: #ffffff;
            --ink-2: rgba(255, 255, 255, .7);
            --ink-3: rgba(255, 255, 255, .5);
            --ink-4: rgba(255, 255, 255, .3);
            --line: rgba(255, 255, 255, .1);
            --line-2: rgba(255, 255, 255, .06);
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
            --glass-border: rgba(255, 255, 255, .1);
            --glass-blur: blur(40px);
            --indigo: #6366f1;
            --indigo-soft: #a5b4fc;
            --pink: #ec4899;
            --pink-soft: #f9a8d4;
            --cyan: #22d3ee;
            --green: #4ade80;
            --amber: #fbbf24;
            --grad-a: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #ec4899 100%);
            --grad-b: linear-gradient(135deg, #6366f1, #ec4899);
            --grad-c: linear-gradient(90deg, #6366f1, #a5b4fc);
            --font-sans: 'Space Grotesk', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --r-sm: 10px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ----- latar belakang & grid ----- */
        .deck::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, .22) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, .15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(34, 211, 238, .08) 0%, transparent 60%);
            z-index: 0;
            animation: ambient 14s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes ambient {
            to {
                opacity: .7;
                transform: scale(1.05);
            }
        }
        .deck::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
            z-index: 0;
            pointer-events: none;
        }

        .deck {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* ----- slide ----- */
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity .9s var(--eq), visibility .9s;
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(165, 180, 252, .25) transparent;
        }
        .slide::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .slide::-webkit-scrollbar-track {
            background: transparent;
        }
        .slide::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(165, 180, 252, .3), rgba(236, 72, 153, .25));
            border-radius: 100px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .slide::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(165, 180, 252, .55), rgba(236, 72, 153, .5));
            background-clip: padding-box;
            border: 2px solid transparent;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
            transition-delay: .4s;
        }
        .slide.exiting {
            transition-delay: 0s;
        }
        .slide-inner {
            min-height: 100%;
            padding: 90px 6vmin 80px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ----- brand & nav (tetap) ----- */
        .brand {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -.01em;
            cursor: pointer;
        }
        .brand .logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--grad-b);
            position: relative;
            flex-shrink: 0;
        }
        .brand .logo::after {
            content: '';
            position: absolute;
            inset: 5px;
            background: var(--bg);
            border-radius: 4px;
        }
        .brand .slash {
            color: var(--indigo-soft);
        }

        .nav {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 6px;
            align-items: center;
            z-index: 100;
            font-family: var(--font-mono);
        }
        .nav button {
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .22);
            color: var(--ink);
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-family: inherit;
            font-size: 13px;
            transition: all .25s;
        }
        .nav button:hover {
            background: rgba(255, 255, 255, .22);
            transform: scale(1.06);
        }
        .counter {
            font-size: 11px;
            letter-spacing: .18em;
            padding: 0 14px;
            color: var(--ink);
            min-width: 62px;
            text-align: center;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--glass-border);
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .section-tag {
            position: fixed;
            bottom: 28px;
            left: 32px;
            z-index: 100;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--ink-3);
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }
        .section-tag .pip {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--indigo-soft);
            box-shadow: 0 0 10px var(--indigo);
            animation: pip 2s infinite;
        }
        @keyframes pip {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .3;
            }
        }

        /* ----- menu button (hamburger) ----- */
        .menu-btn .icon {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .menu-btn .icon i {
            display: block;
            width: 14px;
            height: 1.5px;
            background: currentColor;
            border-radius: 1px;
            transition: all .3s var(--ee);
        }
        .menu-btn.open .icon i:nth-child(1) {
            transform: translateY(4.5px) rotate(45deg);
        }
        .menu-btn.open .icon i:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-btn.open .icon i:nth-child(3) {
            transform: translateY(-4.5px) rotate(-45deg);
        }

        /* ----- menu overlay & panel ----- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, .6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s var(--ee), visibility .35s;
        }
        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .menu-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -48%) scale(.96);
            width: min(560px, 92vw);
            max-height: 84vh;
            overflow-y: auto;
            overflow-x: hidden;
            background: linear-gradient(180deg, rgba(20, 24, 42, .95) 0%, rgba(13, 18, 32, .95) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            z-index: 201;
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s var(--ee), visibility .4s, transform .5s var(--es);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .5), 0 0 60px rgba(99, 102, 241, .15);
            scrollbar-width: thin;
            scrollbar-color: rgba(165, 180, 252, .4) transparent;
        }
        .menu-panel::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .menu-panel::-webkit-scrollbar-track {
            background: transparent;
            margin: 18px 0;
            border-radius: 100px;
        }
        .menu-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(165, 180, 252, .4), rgba(236, 72, 153, .35));
            border-radius: 100px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background .25s;
        }
        .menu-panel::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(165, 180, 252, .6), rgba(236, 72, 153, .5));
            background-clip: padding-box;
            border: 2px solid transparent;
        }
        .menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .menu-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--line-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-header h3 {
            font-weight: 500;
            font-size: 17px;
            letter-spacing: -.01em;
        }
        .menu-header .menu-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .menu-list {
            padding: 12px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: all .25s var(--ee);
            border: 1px solid transparent;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, .05);
            border-color: var(--line);
        }
        .menu-item.current {
            background: linear-gradient(90deg, rgba(99, 102, 241, .18), rgba(236, 72, 153, .08));
            border-color: rgba(99, 102, 241, .3);
        }
        .menu-item .mi-num {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ink-3);
            letter-spacing: .15em;
            width: 28px;
            flex-shrink: 0;
        }
        .menu-item.current .mi-num {
            color: var(--indigo-soft);
        }
        .menu-item .mi-label {
            font-weight: 500;
            font-size: 15px;
            letter-spacing: -.01em;
            flex: 1;
        }
        .menu-item .mi-sub {
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--ink-3);
            margin-top: 2px;
        }
        .menu-item .mi-arr {
            color: var(--ink-4);
            font-size: 14px;
            transition: all .25s;
        }
        .menu-item:hover .mi-arr {
            color: var(--ink);
            transform: translateX(3px);
        }
        .menu-footer {
            padding: 14px 28px 22px;
            border-top: 1px solid var(--line-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .menu-footer kbd {
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 3px 8px;
            font-family: var(--font-mono);
            font-size: 9.5px;
            color: var(--ink-2);
            margin: 0 4px;
        }

        /* ----- reveal ----- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s var(--ee), transform 1s var(--ee);
        }
        .slide.active .reveal {
            opacity: 1;
            transform: translateY(0);
        }
        .slide.active .reveal:nth-of-type(1) {
            transition-delay: .5s;
        }
        .slide.active .reveal:nth-of-type(2) {
            transition-delay: .65s;
        }
        .slide.active .reveal:nth-of-type(3) {
            transition-delay: .8s;
        }
        .slide.active .reveal:nth-of-type(4) {
            transition-delay: .95s;
        }
        .slide.active .reveal:nth-of-type(5) {
            transition-delay: 1.1s;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: rgba(99, 102, 241, .12);
            border: 1px solid rgba(99, 102, 241, .3);
            padding: 7px 16px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--indigo-soft);
            width: fit-content;
            letter-spacing: .02em;
        }
        .eyebrow .dt {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--indigo);
            box-shadow: 0 0 10px var(--indigo);
            animation: pip 2s infinite;
        }

        .h-display {
            font-family: var(--font-sans);
            font-weight: 500;
            line-height: 1.02;
            letter-spacing: -.035em;
        }
        .h-display .grd {
            background: var(--grad-a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .body-lg {
            font-family: var(--font-body);
            font-size: clamp(15px, 1.4vw, 18px);
            line-height: 1.6;
            color: var(--ink-2);
            font-weight: 400;
        }
        .body-md {
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-2);
        }
        .body-sm {
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.5;
            color: var(--ink-3);
        }

        .btn-primary {
            background: #fff;
            color: var(--bg);
            padding: 13px 24px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all .3s;
            border: none;
            text-decoration: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--indigo-soft), #fff);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(165, 180, 252, .25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--ink);
            padding: 13px 24px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all .3s;
            border: 1px solid var(--glass-border);
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .12);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-lg);
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
                   SLIDE UTAMA — DAFTAR ARTIKEL
                   ============================================================ */
        .s-articles {
            padding: 90px 6vmin 80px;
            gap: 32px;
        }
        .s-articles .header-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 4px;
        }
        .s-articles .header-area .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
        }
        .s-articles .header-area .top-row h2 {
            font-size: clamp(32px, 4.2vw, 56px);
        }
        .s-articles .header-area .top-row .article-count {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-3);
            letter-spacing: .15em;
            background: rgba(255, 255, 255, .05);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--line);
            white-space: nowrap;
        }

        /* ---- search bar ---- */
        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .search-row .search-input {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--ink);
            outline: none;
            transition: all .3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-row .search-input::placeholder {
            color: var(--ink-3);
        }
        .search-row .search-input:focus {
            border-color: var(--indigo-soft);
            background: rgba(255, 255, 255, .08);
            box-shadow: 0 0 20px rgba(99, 102, 241, .1);
        }
        .search-row .search-clear {
            background: transparent;
            border: none;
            color: var(--ink-3);
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
            transition: color .25s;
            display: none;
        }
        .search-row .search-clear.visible {
            display: block;
        }
        .search-row .search-clear:hover {
            color: var(--ink);
        }

        /* ---- filter tabs ---- */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line-2);
            margin-top: 4px;
        }
        .filter-tabs .ft {
            padding: 8px 20px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s var(--ee);
            border: 1px solid transparent;
            color: var(--ink-3);
            background: transparent;
        }
        .filter-tabs .ft:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, .05);
        }
        .filter-tabs .ft.active {
            color: #fff;
            background: rgba(99, 102, 241, .25);
            border-color: rgba(99, 102, 241, .4);
            box-shadow: 0 0 20px rgba(99, 102, 241, .1);
        }

        /* ---- grid artikel ---- */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            padding-top: 12px;
        }

        .article-card {
            padding: 24px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all .4s var(--ee);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .article-card:hover {
            border-color: rgba(165, 180, 252, .3);
            transform: translateY(-6px);
            background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
            box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
        }
        .article-card .ac-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .article-card .ac-icon {
            font-size: 28px;
            line-height: 1;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            border: 1px solid var(--line-2);
        }
        .article-card .ac-cat {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--indigo-soft);
            padding: 4px 10px;
            border-radius: 100px;
            background: rgba(99, 102, 241, .12);
            border: 1px solid rgba(99, 102, 241, .15);
            white-space: nowrap;
        }
        .article-card .ac-cat.cat-procurement {
            color: var(--pink-soft);
            background: rgba(236, 72, 153, .12);
            border-color: rgba(236, 72, 153, .15);
        }
        .article-card .ac-cat.cat-civil {
            color: var(--cyan);
            background: rgba(34, 211, 238, .12);
            border-color: rgba(34, 211, 238, .15);
        }
        .article-card .ac-cat.cat-media {
            color: var(--amber);
            background: rgba(251, 191, 36, .12);
            border-color: rgba(251, 191, 36, .15);
        }
        .article-card .ac-cat.cat-chronicles {
            color: var(--green);
            background: rgba(74, 222, 128, .12);
            border-color: rgba(74, 222, 128, .15);
        }

        .article-card h3 {
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 20px;
            letter-spacing: -.02em;
            line-height: 1.2;
        }
        .article-card .ac-excerpt {

            // ---- navigasi slide ----
            function go(t, pushState) {
                if (isAnimating || t === idx || t < 0 || t >= slides.length) return;
                isAnimating = true;
                var old = slides[idx],
                    next = slides[t];
                old.classList.add('exiting');
                old.classList.remove('active');
                setTimeout(function() {
                    next.classList.add('active');
                    next.scrollTop = 0;
                    old.classList.remove('exiting');
                    idx = t;
                    var n = String(idx + 1).padStart(2, '0');
                    currEl.textContent = n;
                    menuCurrEl.textContent = n;
                    sectionEl.textContent = next.dataset.section || 'Artikel';
                    menuItems.forEach(function(el, i) {
                        el.classList.toggle('current', i === idx);
                    });
                    if (t === 0) {
                        renderGrid(currentFilter, currentSearch);
                    }
                    setTimeout(function() { isAnimating = false }, 900);
                }, 350);
            }

            // ---- render grid dengan filter + search ----
            function renderGrid(filter, searchTerm) {
                var filtered = ARTICLES.filter(function(a) {
                    var matchCategory = (filter === 'all' || a.category === filter);
                    var matchSearch = true;
                    if (searchTerm && searchTerm.trim() !== '') {
                        var term = searchTerm.trim().toLowerCase();
                        matchSearch = a.title.toLowerCase().includes(term) ||
                            a.excerpt.toLowerCase().includes(term) ||
                            a.content.toLowerCase().includes(term);
                    }
                    return matchCategory && matchSearch;
                });
                articleCount.textContent = filtered.length + ' artikel';

                if (filtered.length === 0) {
                    grid.innerHTML =
                        '<div class="empty-state"><div class="empty-icon">🔍</div><p>Tidak ditemukan artikel yang cocok.</p></div>';
                    return;
                }

                var html = '';
                filtered.forEach(function(a) {
                    var catClass = '';
                    if (a.category === 'Procurement') catClass = 'cat-procurement';
                    else if (a.category === 'Civil Engineering / Building Technology') catClass = 'cat-civil';
                    else if (a.category === 'News and Media Assessment') catClass = 'cat-media';
                    else if (a.category === 'Agung\'s Chronicles') catClass = 'cat-chronicles';

                    html += `
                        <div class="article-card glass-card reveal" data-id="${a.id}">
                            <div class="ac-top">
                                <div class="ac-icon">${a.icon || '📄'}</div>
                                <span class="ac-cat ${catClass}">${a.category}</span>
                            </div>
                            <h3>${a.title}</h3>
                            <div class="ac-excerpt">${a.excerpt}</div>
                            <div class="ac-meta">
                                <span>${a.date || ''}</span>
                                <span class="ac-read">Baca selengkapnya →</span>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                grid.querySelectorAll('.article-card').forEach(function(card) {
                    card.addEventListener('click', function() {
                        var id = parseInt(this.dataset.id, 10);
                        openDetail(id);
                    });
                });

                // trigger reveal
                grid.querySelectorAll('.reveal').forEach(function(el, i) {
                    el.style.transitionDelay = (0.4 + i * 0.08) + 's';
                });
            }

            // ---- buka detail ----
            function openDetail(id) {
                var article = ARTICLES.find(function(a) { return a.id === id; });
                if (!article) return;
                currentArticleId = id;
                renderDetail(article);
                go(1);
            }

            function renderDetail(article) {
                var catClass = '';
                if (article.category === 'Procurement') catClass = 'cat-procurement';
                else if (article.category === 'Civil Engineering / Building Technology') catClass = 'cat-civil';
                else if (article.category === 'News and Media Assessment') catClass = 'cat-media';
                else if (article.category === 'Agung\'s Chronicles') catClass = 'cat-chronicles';

                // Buat link untuk sharing
                var shareUrl = window.location.href.split('?')[0] + '?article=' + article.id;
                var shareText = encodeURIComponent(article.title + ' — ' + article.excerpt + '  Baca selengkapnya di: ' +
                    shareUrl);

                detailContent.innerHTML = `
                    <div class="dc-head">
                        <span class="dc-cat ${catClass}">${article.category}</span>
                        <h1>${article.title}</h1>
                        <div class="dc-date">${article.date || ''}</div>
                    </div>
                    <div class="dc-body">
                        ${article.content}
                    </div>
                    <div class="share-row">
                        <span class="share-label">📤 Bagikan artikel</span>
                        <a class="share-btn email" href="mailto:?subject=${encodeURIComponent(article.title)}&body=${encodeURIComponent(article.title + '\n\n' + article.excerpt + '\n\nBaca selengkapnya: ' + shareUrl)}" target="_blank" rel="noopener">
                            ✉️ Email
                        </a>
                        <a class="share-btn whatsapp" href="https://api.whatsapp.com/send?text=${shareText}" target="_blank" rel="noopener">
                            💬 WhatsApp
                        </a>
                    </div>
                `;
                var slide = document.getElementById('slideDetail');
                if (slide) slide.scrollTop = 0;
            }

            // ---- filter tabs ----
            filterTabs.addEventListener('click', function(e) {
                var btn = e.target.closest('.ft');
                if (!btn) return;
                filterTabs.querySelectorAll('.ft').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                if (idx === 0) {
                    renderGrid(currentFilter, currentSearch);
                }
            });

            // ---- search ----
            function handleSearch() {
                var term = searchInput.value;
                currentSearch = term;
                if (term.trim() === '') {
                    searchClear.classList.remove('visible');
                } else {
                    searchClear.classList.add('visible');
                }
                if (idx === 0) {
                    renderGrid(currentFilter, currentSearch);
                }
            }

            searchInput.addEventListener('input', handleSearch);
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                handleSearch();
                searchInput.focus();
            });

            // ---- back to list ----
            backBtn.addEventListener('click', function() {
                go(0);
            });

            // ---- brand home ----
            brandHome.addEventListener('click', function() {
                go(0);
            });

            // ---- menu ----
            function openMenu() { menuOpen = true;
                menuOverlay.classList.add('open');
                menuPanel.classList.add('open');
                menuBtn.classList.add('open'); }

            function closeMenu() { menuOpen = false;
                menuOverlay.classList.remove('open');
                menuPanel.classList.remove('open');
                menuBtn.classList.remove('open'); }

            function toggleMenu() { menuOpen ? closeMenu() : openMenu(); }

            menuBtn.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', closeMenu);

            menuItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    var slideIdx = parseInt(this.dataset.slide, 10);
                    if (!isNaN(slideIdx)) go(slideIdx);
                    closeMenu();
                });
            });

            // ---- nav buttons ----
            prevBtn.addEventListener('click', function() { go(idx - 1); });
            nextBtn.addEventListener('click', function() { go(idx + 1); });

            // ---- keyboard ----
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && menuOpen) { closeMenu(); return; }
                if (menuOpen) return;
                if (e.key === 'ArrowRight') go(idx + 1);
                if (e.key === 'ArrowLeft') go(idx - 1);
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault();
                    go(idx + 1); }
                if (e.key === 'm' || e.key === 'M') toggleMenu();
                if (e.key === '1') go(0);
                if (e.key === '2') go(1);
            });

            // ---- touch swipe ----
            var tx = 0,
                ty = 0,
                scrolling = false;
            document.addEventListener('touchstart', function(e) {
                tx = e.touches[0].clientX;
                ty = e.touches[0].clientY;
                scrolling = false;
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                var dx = Math.abs(e.touches[0].clientX - tx);
                var dy = Math.abs(e.touches[0].clientY - ty);
                if (dy > dx) scrolling = true;
            }, { passive: true });
            document.addEventListener('touchend', function(e) {
                if (scrolling || menuOpen) return;
                var dx = e.changedTouches[0].clientX - tx;
                var dy = Math.abs(e.changedTouches[0].clientY - ty);
                if (Math.abs(dx) > 60 && dy < 40) dx < 0 ? go(idx + 1) : go(idx - 1);
            }, { passive: true });

            // ---- cek parameter URL untuk artikel langsung ----
            (function() {
                var params = new URLSearchParams(window.location.search);
                var articleId = params.get('article');
                if (articleId) {
                    var id = parseInt(articleId, 10);
                    if (!isNaN(id) && ARTICLES.some(function(a) { return a.id === id; })) {
                        // render daftar dulu, lalu buka detail
                        renderGrid('all', '');
                        openDetail(id);
                    }
                } else {
                    renderGrid('all', '');
                }
            })();

            // ---- inisialisasi menu ----
            menuItems.forEach(function(el, i) {
                el.classList.toggle('current', i === 0);
            });

        })();
    </script>

</body>
</html>
