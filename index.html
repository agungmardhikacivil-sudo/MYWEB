<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agung Mardhika's Page — Artikel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
                   ROOT & RESET
                   ============================================================ */
        :root {
            --ee: cubic-bezier(0.19, 1, 0.22, 1);
            --eq: cubic-bezier(0.77, 0, 0.175, 1);
            --es: cubic-bezier(0.34, 1.56, 0.64, 1);
            --bg: #0a0e1a;
            --bg-2: #0d1220;
            --ink: #ffffff;
            --ink-2: rgba(255, 255, 255, .7);
            --ink-3: rgba(255, 255, 255, .5);
            --ink-4: rgba(255, 255, 255, .3);
            --line: rgba(255, 255, 255, .1);
            --line-2: rgba(255, 255, 255, .06);
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
            --glass-border: rgba(255, 255, 255, .1);
            --glass-blur: blur(40px);
            --indigo: #6366f1;
            --indigo-soft: #a5b4fc;
            --pink: #ec4899;
            --pink-soft: #f9a8d4;
            --cyan: #22d3ee;
            --green: #4ade80;
            --amber: #fbbf24;
            --grad-a: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #ec4899 100%);
            --grad-b: linear-gradient(135deg, #6366f1, #ec4899);
            --grad-c: linear-gradient(90deg, #6366f1, #a5b4fc);
            --font-sans: 'Space Grotesk', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --r-sm: 10px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .deck::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, .22) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, .15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(34, 211, 238, .08) 0%, transparent 60%);
            z-index: 0;
            animation: ambient 14s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes ambient {
            to {
                opacity: .7;
                transform: scale(1.05);
            }
        }
        .deck::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
            z-index: 0;
            pointer-events: none;
        }

        .deck {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity .9s var(--eq), visibility .9s;
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(165, 180, 252, .25) transparent;
        }
        .slide::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .slide::-webkit-scrollbar-track {
            background: transparent;
        }
        .slide::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(165, 180, 252, .3), rgba(236, 72, 153, .25));
            border-radius: 100px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .slide::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(165, 180, 252, .55), rgba(236, 72, 153, .5));
            background-clip: padding-box;
            border: 2px solid transparent;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
            transition-delay: .4s;
        }
        .slide.exiting {
            transition-delay: 0s;
        }

        .slide-inner {
            min-height: 100%;
            padding: 80px 6vmin 80px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ----- BRAND (sekarang mengikuti scroll) ----- */
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -.01em;
            cursor: pointer;
            background: var(--bg);
            padding: 8px 16px 8px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, .06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            margin: 0 0 16px 0;
            align-self: flex-start;
        }
        .brand .logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--grad-b);
            position: relative;
            flex-shrink: 0;
        }
        .brand .logo::after {
            content: '';
            position: absolute;
            inset: 5px;
            background: var(--bg);
            border-radius: 4px;
        }

        /* ----- NAV (mengikuti scroll) ----- */
        .nav {
            display: flex;
            gap: 6px;
            align-items: center;
            font-family: var(--font-mono);
            background: var(--bg);
            padding: 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, .06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            align-self: flex-end;
            margin-top: -56px; /* geser ke atas agar sejajar dengan brand */
            margin-bottom: 16px;
            position: relative;
            z-index: 10;
        }
        .nav button {
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .22);
            color: var(--ink);
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-family: inherit;
            font-size: 13px;
            transition: all .25s;
        }
        .nav button:hover {
            background: rgba(255, 255, 255, .22);
            transform: scale(1.06);
        }
        .counter {
            font-size: 11px;
            letter-spacing: .18em;
            padding: 0 14px;
            color: var(--ink);
            min-width: 62px;
            text-align: center;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--glass-border);
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ----- SECTION TAG (mengikuti scroll) ----- */
        .section-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--ink-3);
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: none;
            background: var(--bg);
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, .06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .2);
            margin: 32px 0 0 0;
            align-self: flex-start;
        }
        .section-tag .pip {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--indigo-soft);
            box-shadow: 0 0 10px var(--indigo);
            animation: pip 2s infinite;
        }
        @keyframes pip {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }

        /* ----- menu button (hamburger) ----- */
        .menu-btn .icon {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .menu-btn .icon i {
            display: block;
            width: 14px;
            height: 1.5px;
            background: currentColor;
            border-radius: 1px;
            transition: all .3s var(--ee);
        }
        .menu-btn.open .icon i:nth-child(1) {
            transform: translateY(4.5px) rotate(45deg);
        }
        .menu-btn.open .icon i:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .menu-btn.open .icon i:nth-child(3) {
            transform: translateY(-4.5px) rotate(-45deg);
        }

        /* ----- menu overlay & panel (tidak berubah) ----- */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, .6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity .35s var(--ee), visibility .35s;
        }
        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .menu-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -48%) scale(.96);
            width: min(560px, 92vw);
            max-height: 84vh;
            overflow-y: auto;
            overflow-x: hidden;
            background: linear-gradient(180deg, rgba(20, 24, 42, .95) 0%, rgba(13, 18, 32, .95) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            z-index: 201;
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s var(--ee), visibility .4s, transform .5s var(--es);
            box-shadow: 0 30px 80px rgba(0, 0, 0, .5), 0 0 60px rgba(99, 102, 241, .15);
            scrollbar-width: thin;
            scrollbar-color: rgba(165, 180, 252, .4) transparent;
        }
        .menu-panel::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .menu-panel::-webkit-scrollbar-track {
            background: transparent;
            margin: 18px 0;
            border-radius: 100px;
        }
        .menu-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(165, 180, 252, .4), rgba(236, 72, 153, .35));
            border-radius: 100px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background .25s;
        }
        .menu-panel::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(165, 180, 252, .6), rgba(236, 72, 153, .5));
            background-clip: padding-box;
            border: 2px solid transparent;
        }
        .menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .menu-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--line-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-header h3 {
            font-weight: 500;
            font-size: 17px;
            letter-spacing: -.01em;
        }
        .menu-header .menu-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .menu-list {
            padding: 12px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: all .25s var(--ee);
            border: 1px solid transparent;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, .05);
            border-color: var(--line);
        }
        .menu-item.current {
            background: linear-gradient(90deg, rgba(99, 102, 241, .18), rgba(236, 72, 153, .08));
            border-color: rgba(99, 102, 241, .3);
        }
        .menu-item .mi-num {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ink-3);
            letter-spacing: .15em;
            width: 28px;
            flex-shrink: 0;
        }
        .menu-item.current .mi-num {
            color: var(--indigo-soft);
        }
        .menu-item .mi-label {
            font-weight: 500;
            font-size: 15px;
            letter-spacing: -.01em;
            flex: 1;
        }
        .menu-item .mi-sub {
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--ink-3);
            margin-top: 2px;
        }
        .menu-item .mi-arr {
            color: var(--ink-4);
            font-size: 14px;
            transition: all .25s;
        }
        .menu-item:hover .mi-arr {
            color: var(--ink);
            transform: translateX(3px);
        }
        .menu-footer {
            padding: 14px 28px 22px;
            border-top: 1px solid var(--line-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .menu-footer kbd {
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 3px 8px;
            font-family: var(--font-mono);
            font-size: 9.5px;
            color: var(--ink-2);
            margin: 0 4px;
        }

        /* ----- reveal ----- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s var(--ee), transform 1s var(--ee);
        }
        .slide.active .reveal {
            opacity: 1;
            transform: translateY(0);
        }
        .slide.active .reveal:nth-of-type(1) { transition-delay: .5s; }
        .slide.active .reveal:nth-of-type(2) { transition-delay: .65s; }
        .slide.active .reveal:nth-of-type(3) { transition-delay: .8s; }
        .slide.active .reveal:nth-of-type(4) { transition-delay: .95s; }
        .slide.active .reveal:nth-of-type(5) { transition-delay: 1.1s; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: rgba(99, 102, 241, .12);
            border: 1px solid rgba(99, 102, 241, .3);
            padding: 7px 16px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 12px;
            color: var(--indigo-soft);
            width: fit-content;
            letter-spacing: .02em;
        }
        .eyebrow .dt {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--indigo);
            box-shadow: 0 0 10px var(--indigo);
            animation: pip 2s infinite;
        }

        .h-display {
            font-family: var(--font-sans);
            font-weight: 500;
            line-height: 1.02;
            letter-spacing: -.035em;
        }
        .h-display .grd {
            background: var(--grad-a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .body-lg {
            font-family: var(--font-body);
            font-size: clamp(15px, 1.4vw, 18px);
            line-height: 1.6;
            color: var(--ink-2);
            font-weight: 400;
        }

        .btn-primary {
            background: #fff;
            color: var(--bg);
            padding: 13px 24px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all .3s;
            border: none;
            text-decoration: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--indigo-soft), #fff);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(165, 180, 252, .25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--ink);
            padding: 13px 24px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all .3s;
            border: 1px solid var(--glass-border);
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .12);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-lg);
            position: relative;
            overflow: hidden;
        }

        /* ===== SLIDE UTAMA ===== */
        .s-articles {
            padding: 20px 6vmin 80px;
            gap: 32px;
        }
        .s-articles .header-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 4px;
        }
        .s-articles .header-area .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
        }
        .s-articles .header-area .top-row h2 {
            font-size: clamp(32px, 4.2vw, 56px);
        }
        .s-articles .header-area .top-row .article-count {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--ink-3);
            letter-spacing: .15em;
            background: rgba(255, 255, 255, .05);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--line);
            white-space: nowrap;
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .search-row .search-input {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--ink);
            outline: none;
            transition: all .3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .search-row .search-input::placeholder {
            color: var(--ink-3);
        }
        .search-row .search-input:focus {
            border-color: var(--indigo-soft);
            background: rgba(255, 255, 255, .08);
            box-shadow: 0 0 20px rgba(99, 102, 241, .1);
        }
        .search-row .search-clear {
            background: transparent;
            border: none;
            color: var(--ink-3);
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
            transition: color .25s;
            display: none;
        }
        .search-row .search-clear.visible {
            display: block;
        }
        .search-row .search-clear:hover {
            color: var(--ink);
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line-2);
            margin-top: 4px;
        }
        .filter-tabs .ft {
            padding: 8px 20px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .3s var(--ee);
            border: 1px solid transparent;
            color: var(--ink-3);
            background: transparent;
        }
        .filter-tabs .ft:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, .05);
        }
        .filter-tabs .ft.active {
            color: #fff;
            background: rgba(99, 102, 241, .25);
            border-color: rgba(99, 102, 241, .4);
            box-shadow: 0 0 20px rgba(99, 102, 241, .1);
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            padding-top: 12px;
        }

        .article-card {
            padding: 24px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all .4s var(--ee);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .article-card:hover {
            border-color: rgba(165, 180, 252, .3);
            transform: translateY(-6px);
            background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
            box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
        }
        .article-card .ac-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .article-card .ac-icon {
            font-size: 28px;
            line-height: 1;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            border: 1px solid var(--line-2);
        }
        .article-card .ac-cat {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--indigo-soft);
            padding: 4px 10px;
            border-radius: 100px;
            background: rgba(99, 102, 241, .12);
            border: 1px solid rgba(99, 102, 241, .15);
            white-space: nowrap;
        }
        .article-card .ac-cat.cat-procurement {
            color: var(--pink-soft);
            background: rgba(236, 72, 153, .12);
            border-color: rgba(236, 72, 153, .15);
        }
        .article-card .ac-cat.cat-civil {
            color: var(--cyan);
            background: rgba(34, 211, 238, .12);
            border-color: rgba(34, 211, 238, .15);
        }
        .article-card .ac-cat.cat-media {
            color: var(--amber);
            background: rgba(251, 191, 36, .12);
            border-color: rgba(251, 191, 36, .15);
        }
        .article-card .ac-cat.cat-chronicles {
            color: var(--green);
            background: rgba(74, 222, 128, .12);

  "content": "<h2>Sebuah Refleksi Personal dan Literasi Kritis atas Manipulasi Berita</h2>\n\n<h2>LATAR BELAKANG</h2>\n<p>Dalam satu dekade terakhir, berbagai macam perkembangan teknologi telah memungkinkan manusia mendapatkan informasi dengan kecepatan yang belum pernah terjadi sebelumnya. Kita hidup di era di mana berita dari ujung dunia dapat kita akses dalam hitungan detik, hanya melalui genggaman tangan. Namun, kemudahan ini berkembang menjadi masalah baru yang fundamental. Seperti yang diulas secara mendalam oleh filsuf Korea Selatan, Byung-Chul Han, dalam karyanya yang berjudul <em>In the Swarm</em> dan <em>The Agony of Eros</em>, banyaknya berita dan data yang beredar justru mengikis makna dari informasi itu sendiri. Ketika informasi datang tanpa henti dalam potongan-potongan kecil (<em>bits</em>), kemampuan kita untuk merefleksikan, menghubungkan, dan memahami secara utuh menjadi tergerus. Masuknya banyak informasi tanpa proses dialektika yang memadai menjadikan bias yang terjadi dalam memahami informasi semakin sulit dihindari.</p>\n\n<img src=\"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80\" alt=\"Ilustrasi membludaknya informasi media dan surat kabar digital\" />\n\n<p>Saya lahir dan besar di salah satu provinsi di Indonesia yang bergelut dengan konflik dan perang, yaitu Aceh. Tumbuh di tengah kemelut tersebut memberikan saya pelajaran berharga yang tidak akan saya dapatkan di bangku kuliah. Saya belajar banyak dari apa yang terjadi dengan membandingkan antara apa yang diberitakan oleh media arus utama dan apa yang sebenarnya terjadi di lapangan. Pengalaman ini membimbing saya untuk paham bahwa berita bukanlah entitas netral; ia merupakan salah satu alat yang dapat digunakan oleh pihak-pihak tertentu untuk melancarkan kepentingannya. Realitas yang disajikan di layar kaca sering kali telah difilter, dipilih sudut pandangnya, dan dimodifikasi untuk mengakomodasi narasi penguasa atau kelompok oposisi.</p>\n\n<p>Sebagai seorang yang masa kecilnya tumbuh di tengah gemuruh konflik, saya merasa perlu untuk memahami apa yang terjadi secara nyata, agar nantinya tidak salah dalam menentukan pilihan atau mengambil keputusan-keputusan penting. Informasi yang beredar sering kali sudah melalui proses penyaringan dan modifikasi untuk keperluan tertentu.</p>\n\n<p>Fenomena lain yang saya amati secara intensif saat ini adalah perilaku publik di ruang komentar media sosial, baik di Instagram, TikTok, maupun Facebook. Komentar yang disampaikan sering kali tidak relevan dengan substansi, mengandung prasangka, dan cenderung mendukung berita yang selaras dengan kepercayaannya serta mencemooh berita yang tidak sesuai dengan ekspektasinya. Ini adalah cerminan nyata dari <em>confirmation bias</em> yang sangat berbahaya. Proses ini memungkinkan opini masyarakat dibentuk dengan mudah, tanpa adanya proses dialektika yang sehat. Padahal, berita seharusnya memuat data dan fakta lapangan yang murni, tidak disertai retorika ataupun dialektika yang tendensius. Berita seharusnya menjadi fondasi terjadinya dialektika di ruang publik dan di panggung diskusi tersendiri—bukan menjadi produk jadi yang sudah dikunyah sedemikian rupa.</p>\n\n<blockquote>“Berita bukanlah entitas netral; ia merupakan alat yang kerap difilter untuk mengakomodasi narasi tertentu. Berita seharusnya menjadi fondasi dialektika ruang publik, bukan produk jadi yang sudah dikunyah.”</blockquote>\n\n<p>Landasan fondasi berpikir masyarakat pada umumnya ditentukan oleh apa yang dibaca dan didiskusikan di lingkungannya. Dengan berbagai dinamika yang ada, masyarakat saat ini dibentuk untuk berpikir ringkas dan instan. Muncul premis-premis sederhana yang diterima begitu saja tanpa telaah kritis, seperti: <em>\"Orang menjadi miskin karena bodoh dan malas,\"</em> <em>\"Kegagalan suatu program pemerintah pasti diakibatkan oleh korupsi,\"</em> <em>\"Jika perusahaan bangkrut, artinya tidak bisa beradaptasi,\"</em> <em>\"Bencana terjadi pasti karena maksiat,\"</em> atau <em>\"Negara tidak maju karena miskin dan sumber daya manusianya terbelakang.\"</em> Premis-premis ini mereduksi realitas yang kompleks menjadi kepingan sempit yang menguntungkan narasi tertentu. Hal ini membuat informasi yang disediakan menjadi kehilangan makna mendalamnya.</p>\n\n<p>Padahal, sebagai manusia merdeka, kita berhak tahu apa yang sebenarnya terjadi, bagaimana rangkaian kejadian-kejadian saling berhubungan dalam rantai kausalitas yang rumit, dan apa yang harus kita putuskan untuk bertahan hidup ke depan tanpa membuat kesalahan yang fatal. Proses berpikir ini menjadi sulit bagi sebagian orang karena informasi yang diberikan justru sering kali ditujukan hanya untuk menggiring opini atau mengakomodir kepentingan golongan tertentu.</p>\n\n<p>Berangkat dari kegelisahan tersebut, dalam artikel ini saya ingin mencoba menjabarkan berbagai literasi mengenai manipulasi berita serta metode yang mungkin kita gunakan agar dapat menyaring informasi yang bersumber dari pihak terpercaya.</p>\n\n<h2>BERBAGAI LITERASI MENGENAI MANIPULASI BERITA</h2>\n<p>Beberapa teori besar di bidang komunikasi sangat mendukung apa yang saya alami dan amati. Pemahaman atas teori-teori ini menjadi literasi dasar yang penting untuk membongkar bagaimana berita dapat dimanipulasi untuk kepentingan tertentu:</p>\n\n<img src=\"https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=1200&q=80\" alt=\"Ilustrasi literasi teori media dan pembingkaian perspektif\" />\n\n<ul>\n  <li><strong>Model Propaganda (Herman & Chomsky, 1988):</strong> Model propaganda atau yang lebih dikenal dengan <em>Propaganda Model</em> mengidentifikasi lima filter struktural yang menyebabkan media massa menghasilkan informasi yang condong pada kepentingan elite: (1) Kepemilikan dan profit orientasi media, (2) Ketergantungan pada pendapatan iklan, (3) Ketergantungan pada sumber berita resmi (pemerintah dan korporasi), (4) <em>Flak</em> atau tekanan negatif yang dihadirkan sebagai disinsentif, dan (5) Ideologi musuh bersama (<em>anti-communism</em> dalam konteks aslinya, atau narasi pemecah belah lainnya). Kelima filter ini bekerja secara sistemik, bukan konspiratif, untuk membentuk realitas yang diberitakan.</li>\n  <li><strong>Teori Agenda-Setting (McCombs & Shaw, 1972):</strong> Teori ini menyatakan bahwa media massa tidak memberi tahu publik <em>apa yang harus dipikirkan</em> (<em>what to think</em>), tetapi secara dominan memberi tahu publik <em>apa yang harus dipikirkan sebagai hal penting</em> (<em>what to think about</em>). Lebih lanjut, dalam <em>Second-Level Agenda Setting</em> (McCombs, 1997), media juga menentukan atribut atau cara berpikir tentang suatu isu. Misalnya, media dapat memilih untuk menyebut sebuah kebijakan ekonomi sebagai \"gagal dan merugikan\" alih-alih \"menantang dan memerlukan evaluasi.\"</li>\n  <li><strong>Teori Pembingkaian / Framing (Goffman & Entman, 1993):</strong> Robert Entman mendefinisikan <em>framing</em> sebagai proses seleksi dan penonjolan aspek tertentu dari realitas. Framing memiliki empat fungsi utama: (1) mendefinisikan masalah (<em>problem definition</em>), (2) mengidentifikasi penyebab masalah (<em>causal attribution</em>), (3) memberikan evaluasi moral (<em>moral evaluation</em>), dan (4) menawarkan solusi (<em>treatment recommendation</em>). Dengan mengubah framing, sebuah peristiwa yang sama dapat menghasilkan makna yang sangat berbeda.</li>\n  <li><strong>Teori Komunikasi Massa Lasswell (1948):</strong> Harold Lasswell merumuskan paradigma komunikasi yang hingga kini masih menjadi dasar analisis: <em>\"Who Says What in Which Channel to Whom with What Effect.\"</em> Kerangka ini mengingatkan kita untuk selalu mempertanyakan sumber pesan, isi pesan, medium yang digunakan, target audiens, dan efek yang ditimbulkan.</li>\n  <li><strong>Teori Indexing (Bennett, 1990):</strong> Teori ini menyatakan bahwa media cenderung hanya mengindeks (merefleksikan) spektrum opini yang dominan di kalangan elit politik. Jika oposisi dominan, media akan mengindeksnya. Hal ini menjelaskan mengapa pemberitaan sering kali hanya menghadirkan satu sudut pandang dan mengabaikan yang lain.</li>\n  <li><strong>Kode Etik Jurnalistik (KEJ) Dewan Pers:</strong> Kode Etik Jurnalistik menjadi rujukan etis dalam menilai kualitas sebuah pemberitaan. Pasal 1 mengamanatkan independensi dan akurasi, Pasal 3 mewajibkan keberimbangan (<em>cover both sides</em>), dan Pasal 11 menjamin hak jawab bagi pihak yang dirugikan. Pelanggaran terhadap pasal-pasal ini menjadi indikasi bahwa sebuah berita tidak lagi berfungsi sebagai informasi yang jujur, melainkan telah menjadi alat manipulasi.</li>\n</ul>\n\n<h2>STUDI KASUS</h2>\n<p>Untuk menguji bagaimana teori-teori di atas bekerja dalam praktik, saya mengambil dua contoh pemberitaan yang beredar di ranah publik. Keduanya saya analisis menggunakan metode literasi kritis yang telah saya paparkan.</p>\n\n<img src=\"https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80\" alt=\"Ilustrasi analisis hukum, regulasi, dan fakta berita\" />\n\n<h2>Kasus 1: Pemanggilan Dirut PT MSA oleh KPK Terkait Dugaan Suap Pengadaan di Muara Enim</h2>\n<p><strong>Sumber Berita:</strong> AJNN.net - KPK Panggil Dirut PT MSA Terkait Dugaan Suap Pengadaan Barang dan Jasa Muara Enim</p>\n<p><strong>Ringkasan Isu:</strong> Komisi Pemberantasan Korupsi (KPK) memanggil Direktur Utama PT Millenium Solusi Abadi (MSA) berinisial HVA sebagai saksi dalam penyidikan kasus dugaan suap terkait pengadaan barang dan jasa di lingkungan Pemerintah Kabupaten Muara Enim, Sumatera Selatan. Pemanggilan ini menjadi bagian dari pengembangan penyidikan kasus dugaan suap pengadaan <em>smart board</em> dan Chromebook pada Dinas Pendidikan dan Kebudayaan Kabupaten Muara Enim. Dalam dakwaan yang telah disusun KPK, dua tersangka dari pihak swasta, Fika Nur Alawi dan Cory Erin Hardi, diduga memberikan komitmen <em>fee</em> kepada pejabat terkait mencapai Rp13,1 miliar. Suap diduga diberikan untuk mengatur pengadaan melalui e-katalog agar perusahaan yang berafiliasi dengan PT MSA mendapat paket proyek senilai Rp62,4 miliar.</p>\n\n<p><strong>Analisis Framing dan Agenda-Setting:</strong> Isu pemanggilan Dirut PT MSA adalah bagian dari narasi besar pemberantasan korupsi yang sedang digencarkan KPK. Namun, yang perlu diwaspadai adalah bagaimana media memilih untuk <em>membingkai</em> (framing) pemberitaan ini. Apakah media menyoroti aspek pencegahan dan transparansi yang dilakukan KPK, atau justru lebih menonjolkan aspek skandal dan nominal uang yang fantastis (Rp13,1 miliar dan Rp62,4 miliar)? Apakah ada media yang menggunakan judul provokatif seperti \"Korupsi Miliaran di Muara Enim\" versus \"KPK Panggil Saksi untuk Penguatan Kasus\"? Dalam konteks Agenda-Setting, kita perlu bertanya: mengapa isu ini muncul dan diberi porsi besar pada waktu tertentu? Apakah ada isu lain yang sedang berusaha \"ditenggelamkan\" oleh narasi korupsi ini?</p>\n<p><strong>Analisis Sumber dan Propaganda Model:</strong> Berita ini bersumber dari proses hukum resmi KPK. Namun, literasi kritis menuntut kita untuk memeriksa narasumber yang dihadirkan oleh media. Apakah media hanya mengutip pernyataan KPK (sumber resmi) tanpa memberikan ruang bagi pihak PT MSA atau pengacara mereka untuk memberikan klarifikasi? Jika ya, ini mengindikasikan adanya ketergantungan pada satu sumber berita (filter ke-3 dalam Propaganda Model). Perhatikan juga siapa pemilik media yang memberitakan kasus ini. Apakah ada kepentingan politik atau ekonomi di balik peliputan yang intensif terhadap kasus tertentu? (Filter ke-1 dan ke-2 dalam Propaganda Model).</p>\n<p><strong>Analisis Bias Kognitif:</strong> Bagi publik, berita tentang korupsi dengan nominal besar sangat mudah memicu <em>Affect Heuristic</em> (kemarahan) dan <em>Confirmation Bias</em> (keyakinan bahwa \"semua pejabat korup\"). Publik cenderung langsung menghakimi tanpa menunggu proses hukum yang adil. Di ruang komentar, kita akan dengan mudah menemukan komentar-komentar yang menghakimi dan menyimpulkan kesalahan sebelum ada putusan pengadilan yang berkekuatan hukum tetap.</p>\n<p><strong>Uji Kode Etik Jurnalistik:</strong> Apakah media yang memberitakan kasus ini menerapkan asas keberimbangan (Pasal 3 KEJ) dengan memuat pernyataan dari pihak PT MSA atau kuasa hukumnya? Apakah ada hak jawab yang diberikan kepada pihak-pihak yang disebutkan dalam berita? (Pasal 11 KEJ). Jika media hanya menyajikan satu sisi (versi KPK) dan tidak memberi ruang bagi pihak lain, maka pemberitaan tersebut telah kehilangan objektivitasnya dan berpotensi menjadi alat untuk membentuk opini publik yang bias.</p>\n\n<h2>Kasus 2: Kabar Fadhlullah Jadi Plh Gubernur Aceh — Benarkah Ini 'Kudeta' terhadap Mualem?</h2>\n<p><strong>Sumber Berita:</strong> Pintoe.co - Kabar Fadhlullah Jadi Plh Gubernur Aceh Benarkah Ini Kudeta terhadap Mualem</p>\n<p><strong>Ringkasan Isu:</strong> Kabar mengenai Wakil Gubernur Aceh, Fadhlullah, yang ditunjuk sebagai Pelaksana Harian (Plh) Gubernur Aceh beredar ketika Gubernur Muzakir Manaf atau Mualem sedang menjalani pengobatan di luar negeri. Kabar ini kemudian memunculkan tafsir politik. Ada yang menyebut Fadhlullah sedang mengambil alih kendali pemerintahan Aceh, bahkan menyebutnya sebagai \"kudeta\" terhadap Mualem. Namun, Pemerintah Aceh membantah adanya penunjukan tersebut.</p>\n<p>Jika merujuk pada aturan pemerintahan, persoalannya tidak sesederhana itu. UU Nomor 23 Tahun 2014 tentang Pemerintahan Daerah mengatur bahwa ketika kepala daerah berhalangan sementara, wakil kepala daerah melaksanakan tugas dan wewenang kepala daerah (Pasal 65 ayat 4 dan Pasal 66 ayat 1 huruf c). Aceh juga memiliki aturan khusus melalui UU Nomor 11 Tahun 2006 tentang Pemerintahan Aceh (UUPA) yang dalam Pasal 44 ayat (1) huruf i menyebut hal yang sama. Dengan demikian, pelaksanaan tugas gubernur oleh wakil gubernur ketika gubernur berhalangan adalah mekanisme yang memang disediakan oleh undang-undang.</p>\n\n<p><strong>Analisis Framing dan Agenda-Setting:</strong> Kasus ini adalah contoh sempurna bagaimana sebuah peristiwa hukum-administrasi yang normal dapat dibingkai (<em>framed</em>) menjadi isu politik yang sensasional. Framing yang digunakan: Media atau aktor tertentu memilih kata <strong>\"kudeta\"</strong> untuk membingkai peristiwa ini. Padahal, secara faktual, yang terjadi adalah pelaksanaan tugas rutin berdasarkan undang-undang. Dengan menggunakan kata \"kudeta\", media telah mendefinisikan masalah (Pembingkaian Fungsi 1) sebagai \"perebutan kekuasaan ilegal,\" memberikan evaluasi moral (Fungsi 3) bahwa tindakan ini \"tidak sah dan berbahaya,\" dan secara implisit menawarkan solusi (Fungsi 4) berupa \"penolakan terhadap Fadhlullah.\" Dalam konteks Agenda-Setting, pertanyaan kritisnya adalah: <em>mengapa</em> isu ini muncul dan dibingkai sebagai \"kudeta\"? Apakah ada agenda untuk mendiskreditkan Fadhlullah atau menciptakan ketegangan politik di Aceh? Isu ini muncul di tengah ketidakhadiran Mualem, yang secara alami menimbulkan ruang kosong kekuasaan. Narasi \"kudeta\" adalah cara untuk mengisi ruang kosong tersebut dengan narasi konflik.</p>\n<p><strong>Analisis Sumber dan Propaganda Model:</strong> Siapa sumber pertama yang menyebarkan kabar \"kudeta\" ini? Apakah dari kalangan oposisi, aktivis, atau akun anonim? Media yang memberitakan isu ini, apakah mereka mengutip pernyataan resmi dari Pemerintah Aceh yang membantah adanya penunjukan Plh? Atau justru lebih banyak mengutip \"spekulasi politik\" dan \"tafsir\" dari sumber yang tidak jelas? Dalam konteks Propaganda Model, kita perlu melihat apakah ada kepentingan politik di balik penggiringan opini bahwa Fadhlullah melakukan \"kudeta.\" Siapa yang diuntungkan jika Fadhlullah dianggap sebagai \"perampas kekuasaan\"?</p>\n<p><strong>Analisis Bias Kognitif:</strong> Kata \"kudeta\" adalah pemicu emosi yang sangat kuat (<em>Affect Heuristic</em>). Masyarakat yang mendengar kata ini akan langsung membayangkan pengambilalihan kekuasaan secara kasar dan ilegal, tanpa membaca penjelasan lebih lanjut bahwa mekanisme tersebut sebenarnya diatur oleh undang-undang. Di sinilah <em>Availability Cascade</em> bekerja: ketika kata \"kudeta\" terus diulang-ulang di linimasa media sosial, ia akan terasa semakin nyata dan faktual, meskipun secara hukum tidak berdasar.</p>\n<p><strong>Uji Kode Etik Jurnalistik dan Fakta:</strong> Apakah media yang memberitakan \"kudeta\" ini juga memuat pernyataan dari pihak Fadhlullah atau Pemerintah Aceh yang menjelaskan dasar hukum pelaksanaan tugas wagub? Media seharusnya memverifikasi fakta bahwa \"Plh\" adalah istilah yang dikenal dalam UU Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan untuk pelaksanaan tugas rutin ketika pejabat definitif berhalangan sementara. Fakta bahwa Pemerintah Aceh membantah adanya penunjukan Plh justru menunjukkan bahwa yang terjadi bukanlah \"kudeta,\" melainkan isu yang tidak berdasar. Dengan demikian, pemberitaan yang menggunakan kata \"kudeta\" tanpa klarifikasi yang berimbang adalah bentuk <strong>Misinformasi</strong> (kesalahan tanpa niat jahat) atau bahkan <strong>Disinformasi</strong> (jika sengaja dibuat untuk menjatuhkan Fadhlullah).</p>\n\n<h2>PROSPEK</h2>\n<p>Dua kasus yang saya analisis di atas—pemberitaan tentang pemanggilan Dirut PT MSA oleh KPK dan isu \"kudeta\" di Aceh—menunjukkan betapa pentingnya literasi kritis dalam mengonsumsi berita. Di satu sisi, kita menghadapi berita yang bersumber dari proses hukum yang sah (KPK), tetapi tetap berpotensi dibingkai secara sensasional untuk membangun opini publik. Di sisi lain, kita menghadapi berita yang sama sekali tidak berdasar secara hukum (isu \"kudeta\"), tetapi dibingkai sedemikian rupa sehingga memicu emosi dan kepercayaan publik.</p>\n<p>Kedua kasus ini mengajarkan kita bahwa sebagai manusia merdeka, kita tidak harus menjadi korban pasif dari arus informasi. Dengan menguasai pisau bedah teoritis—mulai dari Model Propaganda Chomsky, Agenda-Setting, Framing, hingga Kode Etik Jurnalistik—kita mampu menggali kebenaran di balik narasi yang disajikan.</p>\n<p>Ke depan, kemampuan untuk membaca kritis sebuah berita akan menjadi kecakapan hidup yang fundamental, setara dengan kemampuan membaca dan menulis itu sendiri. Masyarakat yang tidak dibekali literasi media akan terus menjadi sasaran empuk bagi kepentingan politik dan ekonomi yang memanfaatkan disinformasi untuk tujuan sempit mereka. Namun, saya optimistis bahwa kesadaran kritis dapat dibangun, dan publik memiliki kapasitas untuk belajar dari pengalaman serta kesalahan dalam mengonsumsi informasi.</p>\n\n<ol>\n  <li><strong>Verifikasi silang:</strong> Biasakan untuk membandingkan setidaknya tiga sumber berita dengan kecenderungan editorial yang berbeda guna memperoleh gambaran peristiwa yang utuh.</li>\n  <li><strong>Waspadai diksi provokatif:</strong> Semakin tinggi muatan emosional dan sensasional dalam sebuah judul, semakin besar peluang bahwa pesan tersebut dirancang untuk membingkai persepsi alih-alih menyajikan fakta.</li>\n  <li><strong>Rujuk data dan regulasi resmi:</strong> Kembalikan telaah pada basis hukum formal dan data primer sebelum mempercayai klaim sepihak.</li>\n  <li><strong>Pahami latar belakang media:</strong> Ketahui struktur kepemilikan dan afiliasi redaksi agar dapat menakar potensi bias secara objektif.</li>\n</ol>\n\n<p>Dengan bekal literasi ini, publik tidak lagi menjadi penonton pasif yang mudah dibentuk, melainkan aktor sadar yang turut menjaga kualitas ruang publik digital. Pada akhirnya, masa depan informasi yang sehat bergantung pada seberapa cerdas kita sebagai individu dalam memilih, menyaring, dan memaknai setiap informasi yang masuk ke dalam kehidupan kita sehari-hari.</p>\n\n<h2>Referensi</h2>\n<ul>\n  <li>Bennett, W. L. (1990). Toward a Theory of Press-State Relations in the United States. Journal of Communication, 40(2), 103-127.</li>\n  <li>Entman, R. M. (1993). Framing: Toward Clarification of a Fractured Paradigm. Journal of Communication, 43(4), 51-58.</li>\n  <li>Han, B. C. (2017). In the Swarm: Digital Prospects. MIT Press.</li>\n  <li>Han, B. C. (2019). The Agony of Eros. MIT Press.</li>\n  <li>Herman, E. S., & Chomsky, N. (1988). Manufacturing Consent: The Political Economy of the Mass Media. Pantheon Books.</li>\n  <li>Heuer, R. J. (1999). Psychology of Intelligence Analysis. Center for the Study of Intelligence, CIA.</li>\n  <li>Lasswell, H. D. (1948). The Structure and Function of Communication in Society. In L. Bryson (Ed.), The Communication of Ideas. Harper and Row.</li>\n  <li>McCombs, M. E., & Shaw, D. L. (1972). The Agenda-Setting Function of Mass Media. Public Opinion Quarterly, 36(2), 176-187.</li>\n  <li>Undang-Undang Nomor 40 Tahun 1999 tentang Pers.</li>\n  <li>Kode Etik Jurnalistik (KEJ) Dewan Pers Indonesia.</li>\n  <li>Undang-Undang Nomor 23 Tahun 2014 tentang Pemerintahan Daerah.</li>\n  <li>Undang-Undang Nomor 11 Tahun 2006 tentang Pemerintahan Aceh (UUPA).</li>\n  <li>Undang-Undang Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan.</li>\n</ul>"

  "date": "14 Agustus 2026",
  "icon": "📦",
  "content": "<h2>Mengintegrasikan prinsip hijau dalam rantai pasok</h2>\n<p>Industri konstruksi menyumbang hampir 40% emisi karbon global. Salah satu pintu masuk terbesar untuk mengurangi dampak tersebut adalah melalui <strong>pengadaan yang berkelanjutan</strong>.</p>\n        <p>Dalam praktiknya, pengadaan berkelanjutan berarti memilih material dengan <em>life-cycle assessment</em> rendah, mengutamakan pemasok lokal, dan menerapkan sistem pelacakan yang transparan.</p>\n        <h2>Langkah awal yang bisa diambil</h2>\n        <ul>\n          <li>Audit rantai pasok saat ini untuk mengidentifikasi titik-titik pemborosan.</li>\n          <li>Menetapkan kriteria keberlanjutan sebagai bagian dari evaluasi tender.</li>\n          <li>Membangun kemitraan dengan pemasok yang memiliki sertifikasi lingkungan.</li>\n        </ul>\n        <img src=\"https://via.placeholder.com/800x400/1a1f35/818cf8?text=Contoh+Visualisasi+Data\" alt=\"Grafik ilustrasi pengadaan berkelanjutan\" />\n        <blockquote>“Pengadaan bukan hanya soal harga terendah, tetapi nilai terbaik untuk generasi mendatang.”</blockquote>\n        <p>Dengan pendekatan ini, proyek infrastruktur tidak hanya kokoh secara fisik, tetapi juga bertanggung jawab secara ekologis.</p>\n\n<h2>Referensi</h2>\n<ul>\n  <li>World Green Building Council (2023)</li>\n  <li>ISO 20400: Sustainable Procurement</li>\n</ul>",
  "author": "Agung Mardhika"

  "id": 10,
  "title": "Bedah Komprehensif Perlem LKPP No. 2 Tahun 2026: Transformasi Ekosistem Katalog Elektronik dan E-Purchasing Pengadaan Barang/Jasa Pemerintah",
  "category": "Procurement",
  "excerpt": "Analisis mendalam dan komparatif Peraturan LKPP Nomor 2 Tahun 2026 yang resmi mencabut Perlem LKPP Nomor 9 Tahun 2021. Mengulas tuntas restrukturisasi pengelolaan katalog, mekanisme pencantuman barang/jasa, integrasi modul Toko Daring, instrumen HPS/Referensi Harga, jaminan pelaksanaan, pembagian kewenangan PPK/Pejabat Pengadaan/Pokja Pemilihan pada seluruh metode E-purchasing, hingga sistem pengawasan.",
  "date": "4 September 2026",
  "icon": "📜",
  "content": "<div style=\"background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 18px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;\"><div style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"font-size: 1.1rem;\">✍️</span><span style=\"color: #94a3b8; font-size: 0.9rem;\">Penulis:</span><span style=\"color: #38bdf8; font-weight: 600; font-size: 0.95rem;\">Dr. Agung Mardhika, ST, MT</span></div><div style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"font-size: 1.1rem;\">📅</span><span style=\"color: #94a3b8; font-size: 0.9rem;\">Terbit:</span><span style=\"color: #e2e8f0; font-weight: 500; font-size: 0.95rem;\">4 September 2026</span></div></div>\n<h2>1. Landasan Yuridis dan Urgensi Transformasi</h2>\n<p>Lembaga Kebijakan Pengadaan Barang/Jasa Pemerintah (LKPP) secara resmi memberlakukan <strong>Peraturan Lembaga Kebijakan Pengadaan Barang/Jasa Pemerintah Nomor 2 Tahun 2026</strong> tentang Katalog Elektronik dalam Pengadaan Barang/Jasa Pemerintah (diundangkan pada 1 September 2026, Berita Negara RI Tahun 2026 No. 608). Regulasi ini secara definitif <strong>mencabut dan menyatakan tidak berlaku Peraturan LKPP Nomor 9 Tahun 2021</strong> tentang Toko Daring dan Katalog Elektronik dalam Pengadaan Barang/Jasa Pemerintah.</p>\n<p>Langkah deregulasi dan modernisasi ini merupakan tindak lanjut langsung dari mandat Pasal 50 ayat (5c), Pasal 72 ayat (4), dan Pasal 72B ayat (2) Peraturan Presiden Nomor 16 Tahun 2018 sebagaimana telah beberapa kali diubah terakhir dengan <strong>Peraturan Presiden Nomor 46 Tahun 2025</strong>. Beleid ini dirancang untuk mereformasi tata kelola platform digital pengadaan nasional dari sekadar etalase digital transaksional menjadi instrumen strategis perlindungan nilai belanja publik (<em>value for money</em>), efisiensi birokrasi, serta penguatan industri dan pelaku usaha dalam negeri.</p>\n\n<img src=\"https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=800&q=80\" alt=\"Ilustrasi penandatanganan dokumen regulasi pengadaan pemerintah dan kepatuhan kontrak hukum\" />\n\n<h2>2. Rekonstruksi 5 Pilar Penyelenggaraan Katalog Elektronik</h2>\n<p>Pasal 3 Perlem LKPP No. 2 Tahun 2026 menetapkan ruang lingkup penyelenggaraan Katalog Elektronik ke dalam 5 (lima) pilar operasional yang mengalami lompatan regulasi dibanding Perlem LKPP No. 9 Tahun 2021:</p>\n\n<h3>Pilar I: Tata Kelola & Pengelolaan Katalog Elektronik</h3>\n<p>Struktur tata kelola mengalami metamorfosis dari sistem birokrasi konvensional menjadi arsitektur berbasis klaster digital yang profesional:</p>\n<ul>\n  <li><strong>Level Pengelolaan Platform:</strong> Pengelolaan kini dibagi secara tegas menjadi Pusat Katalog Elektronik, Katalog Elektronik Nasional (LKPP), Katalog Elektronik Sektoral (K/L), Katalog Elektronik Lokal (Pemda), serta penambahan yurisdiksi baru yaitu <em>Katalog Elektronik oleh Institusi Lainnya</em>.</li>\n  <li><strong>Lembaga & Aktor Baru Pengelola Pusat:</strong> Diperkenalkan peran strategis <em>Mitra Instansi Pengelola</em> (pihak penugasan akselerasi transformasi digital untuk pembangunan, pembiayaan, integrasi, dan pemeliharaan platform), <em>Deputi Bidang Transformasi Pengadaan Digital</em>, <em>Direktur Pengembangan Pasar Digital Pengadaan</em>, serta <em>Manajer Kategori Produk</em> yang bertugas menyusun telaahan dan dokumen pengumuman etalase.</li>\n  <li><strong>Spesialisasi Tim Kurasi:</strong> Tidak ada lagi proses kurasi tunggal yang bercampur aduk. Sistem kini membagi fungsi fungsional verifikator ke dalam <em>Kurator Master Produk</em>, <em>Kurator Penayangan Produk</em>, dan <em>Kurator Koleksi Produk</em> baik di level Nasional, Sektoral, Lokal, maupun Institusi Lainnya.</li>\n</ul>\n\n<h3>Pilar II: Pencantuman Barang/Jasa (Koleksi & Master Data)</h3>\n<p>Berbeda dengan Perlem 9/2021 yang proses pencantumannya berbasis penelaahan produk umum sederhana, Pasal 10 Perlem 2/2026 menetapkan 6 (enam) tahapan ketat pencantuman: (1) Penelaahan kategori produk, (2) Pembuatan kategori produk, (3) Pengisian dan kurasi master produk penyedia, (4) Penayangan produk, (5) Pembaruan produk, dan (6) Koleksi produk. Selain itu, ditegaskan mekanisme integrasi pencantuman produk hasil <strong>konsolidasi pengadaan</strong> yang diselenggarakan oleh LKPP, K/L, Pemda, maupun Institusi Lainnya.</p>\n\n<h3>Pilar III: Pengelolaan Toko Daring sebagai Modul Terpadu</h3>\n<p>Pada Perlem 9/2021, Toko Daring diposisikan sebagai platform mandiri yang berjalan berdampingan dengan Katalog Elektronik. Di dalam Perlem 2/2026, Toko Daring secara resmi direposisi menjadi <strong>modul/bagian terintegrasi di dalam sistem Katalog Elektronik</strong> dengan parameter yang sangat ketat:</p>\n<ul>\n  <li>Hanya bermitra dengan Penyelenggara Perdagangan Melalui Sistem Elektronik (PPMSE) berbentuk <em>marketplace</em>.</li>\n  <li>Khusus menayangkan produk dalam negeri (PDN) serta produk Usaha Mikro, Usaha Kecil (UMK), dan Koperasi (pengecualian produk non-UMKK hanya jika barang tersebut belum mampu diproduksi oleh UMKK).</li>\n  <li>Pagu transaksi dibatasi secara limitatif: <strong>paling banyak Rp50.000.000,00 (lima puluh juta rupiah)</strong> per transaksi.</li>\n</ul>\n\n<h3>Pilar IV: Pelaksanaan E-Purchasing yang Modern</h3>\n<p>Transformasi menyeluruh pada tata cara eksekusi belanja, validasi kelayakan harga, pembagian kewenangan aparatur pengadaan, pemanfaatan oleh entitas non-K/L/PD, hingga pengamanan kontrak melalui jaminan pelaksanaan.</p>\n\n<h3>Pilar V: Pengawasan Terstruktur dan Penanganan Laporan</h3>\n<p>Perlem 2/2026 mendedikasikan satu babak khusus (Pasal 21) terkait instrumen pengawasan yang terbagi atas: (1) <em>Pengawasan penayangan produk</em> yang dilaksanakan secara berkala melalui metode acak (sampling) oleh Direktur Pasar Digital (Nasional) dan Pimpinan Tinggi Pratama UKPBJ (Sektoral); serta (2) <em>Penanganan pelaporan produk</em> oleh Pengelola Pusat Katalog Elektronik. Pelanggaran penayangan produk dan syarat ketentuan langsung bermuara pada pengenaan sanksi administratif dan hukum terhadap Penyedia Katalog.</p>\n\n<img src=\"https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=800&auto=format&fit=crop\" alt=\"Operasional logistik modern dan integrasi rantai pasok digital sistem e-purchasing pengadaan pemerintah\" />\n\n<h2>3. Aturan Wajib E-Purchasing, Ambang Pengecualian, dan Analisa Pasar</h2>\n<p>Pasal 12 Perlem LKPP 2/2026 menegaskan asas <strong>Wajib E-Purchasing</strong> bagi seluruh Kementerian, Lembaga, dan Pemerintah Daerah untuk memenuhi kebutuhan barang, pekerjaan konstruksi, jasa lainnya, maupun jasa konsultansi selama produk tersebut tersedia di dalam sistem Katalog Elektronik.</p>\n<p>Meskipun bersifat wajib, regulasi memberikan pintu pengecualian formal yang akuntabel. Pelaksanaan pengadaan dapat dikecualikan dari metode E-purchasing apabila:</p>\n<ol>\n  <li>Barang/jasa dalam katalog tidak dapat memenuhi kebutuhan dari aspek volume, spesifikasi teknis, waktu, lokasi, dan/atau layanan pendukung; atau</li>\n  <li>Berdasarkan pertimbangan PPK, pengadaan dinilai jauh lebih efisien dan/atau efektif apabila dieksekusi dengan metode pemilihan di luar E-purchasing.</li>\n</ol>\n<p>Pengecualian tersebut wajib didasarkan pada <strong>penilaian formal oleh PPK melalui Analisa Pasar</strong> (dapat dibantu tim ahli/kompeten), yang mencakup identifikasi: ketersediaan produk/penyedia, kapasitas teknis dan kesanggupan pemenuhan volume, kesanggupan tenggat waktu & cakupan lokasi, kepatuhan kategori, serta perbandingan kewajaran harga katalog terhadap harga barang sejenis di luar sistem pasar digital.</p>\n\n<h2>4. Standar Baru Pengendalian Harga: HPS vs. Referensi Harga</h2>\n<p>Guna menutup celah pemborosan anggaran dan menjamin kewajaran nilai transaksi, Pasal 13 Perlem 2/2026 menetapkan instrumen penetapan harga batas dengan ambang batas (<em>threshold</em>) Rp100 juta:</p>\n<ul>\n  <li><strong>Nilai Transaksi s.d. Rp100.000.000,00 (seratus juta rupiah):</strong> PPK wajib menyiapkan <strong>Referensi Harga</strong> yang berfungsi sebagai pembanding guna menilai kewajaran harga satuan produk yang ditawarkan penyedia.</li>\n  <li><strong>Nilai Transaksi di atas Rp100.000.000,00 (seratus juta rupiah):</strong> PPK wajib menetapkan <strong>Harga Perkiraan Sendiri (HPS)</strong> yang telah memperhitungkan keuntungan wajar, biaya tidak langsung (<em>overhead</em>), serta Pajak Pertambahan Nilai (PPN).</li>\n  <li><em>Pengecualian:</em> Penyusunan HPS maupun Referensi Harga dikecualikan secara mutlak untuk transaksi E-purchasing yang dilaksanakan melalui metode Pembelian Langsung pada kategori produk atau koleksi produk yang telah menerapkan skema <strong>Harga Tetap</strong>.</li>\n</ul>\n\n<h2>5. Jaminan Pelaksanaan dalam E-Purchasing</h2>\n<p>Memperbaiki kelemahan yuridis kontrak masa lalu, Pasal 20 secara tegas mewajibkan <strong>Jaminan Pelaksanaan</strong> untuk pengadaan barang, pekerjaan konstruksi, dan jasa lainnya dengan nilai kontrak <strong>paling sedikit di atas Rp200.000.000,00 (dua ratus juta rupiah)</strong>. Jaminan pelaksanaan ini dikecualikan khusus bagi transaksi jasa lainnya yang aset penyedianya dikuasai penuh oleh pengguna anggaran.</p>\n\n<h2>6. Metode E-Purchasing dan Pembagian Kewenangan Pelaksana</h2>\n<p>Metode pelaksanaan E-purchasing kini disederhanakan menjadi 3 (tiga) metode resmi: <em>Pembelian Langsung</em>, <em>Negosiasi Harga</em>, dan <em>Mini Kompetisi</em> (metode <em>Competitive Catalogue</em> pada Perlem 9/2021 resmi dihapus). Adapun pembagian kewenangan eksekusi antara Pejabat Pengadaan, PPK, dan Pokja Pemilihan diatur secara terperinci sebagai berikut:</p>\n\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse: collapse; width: 100%; text-align: left; border-color: #334155; margin-bottom: 24px;\">\n  <thead>\n    <tr style=\"background-color: #1e293b; color: #f8fafc;\">\n      <th style=\"border: 1px solid #334155; padding: 10px;\">Metode E-Purchasing</th>\n      <th style=\"border: 1px solid #334155; padding: 10px;\">Kriteria dan Batasan Nilai Paket</th>\n      <th style=\"border: 1px solid #334155; padding: 10px;\">Aparatur Pelaksana Resmi</th>\n    </tr>\n  </thead>\n  <tbody style=\"background-color: #0f172a; color: #cbd5e1;\">\n    <tr>\n      <td rowspan=\"3\" style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #38bdf8;\">1. Pembelian Langsung</strong><br/><em style=\"font-size: 0.85rem; color: #94a3b8;\">(Pasal 15)</em></td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi s.d. Rp50.000.000,00 pada kategori telaahan atau melalui modul Toko Daring (kebutuhan rutin/harga baku)</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pengadaan</strong></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Kategori produk/koleksi produk berskema Harga Tetap dengan nilai s.d. Rp200.000.000,00</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pengadaan</strong></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Kategori produk/koleksi produk berskema Harga Tetap dengan nilai di atas Rp200.000.000,00</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pembuat Komitmen (PPK)</strong></td>\n    </tr>\n    <tr>\n      <td rowspan=\"3\" style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #38bdf8;\">2. Negosiasi Harga</strong><br/><em style=\"font-size: 0.85rem; color: #94a3b8;\">(Pasal 16)</em><br/><span style=\"font-size: 0.8rem; color: #94a3b8;\">*Menegosiasikan harga satuan, ongkir, & biaya lain</span></td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi s.d. Rp200.000.000,00 (termasuk modul Toko Daring berfitur negosiasi s.d. Rp50 juta)</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pengadaan</strong></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi di atas Rp200.000.000,00 untuk kriteria terbatas: (a) Produk hasil konsolidasi; (b) Praktik bisnis mapan; atau (c) Swakelola Tipe I/II/III</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pembuat Komitmen (PPK)</strong></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi di atas Rp200.000.000,00 di luar kriteria negosiasi khusus PPK</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pokja Pemilihan</strong></td>\n    </tr>\n    <tr>\n      <td rowspan=\"2\" style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #38bdf8;\">3. Mini Kompetisi</strong><br/><em style=\"font-size: 0.85rem; color: #94a3b8;\">(Pasal 17)</em><br/><span style=\"font-size: 0.8rem; color: #94a3b8;\">*Kompetisi antara &ge; 2 penyedia dengan spek sejenis</span></td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi s.d. Rp200.000.000,00</td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pejabat Pengadaan</strong></td>\n    </tr>\n    <tr>\n      <td style=\"border: 1px solid #334155; padding: 10px;\">Nilai transaksi di atas Rp200.000.000,00 <em>(Catatan: bila Pokja Pemilihan belum dapat melaksanakan, dapat dieksekusi oleh PPK)</em></td>\n      <td style=\"border: 1px solid #334155; padding: 10px;\"><strong style=\"color: #f1f5f9;\">Pokja Pemilihan</strong></td>\n    </tr>\n  </tbody>\n</table>\n\n<h2>7. Implikasi Lintas Sektor: Konstruksi, Swakelola, dan Pemerintah Desa</h2>\n<p>Peraturan LKPP No. 2 Tahun 2026 memperluas batas interoperabilitas pengadaan ke ranah yang lebih inklusif:</p>\n<ul>\n  <li><strong>Proteksi Pelaku Konstruksi Lokal (Pasal 18):</strong> Pelaksanaan E-purchasing untuk sektor pekerjaan konstruksi secara imperatif <strong>diutamakan bagi Pelaku Usaha lokal</strong> sesuai pedoman pelaksanaan melalui penyedia.</li>\n  <li><strong>Kanalisasi Swakelola (Pasal 12):</strong> Sistem E-purchasing kini resmi dapat digunakan untuk memilih dan bertransaksi langsung dengan calon pelaksana Swakelola Tipe I, Tipe II, dan Tipe III. Kontrak diikat sah melalui penandatanganan Surat/Bukti Pesanan secara elektronik antara PPK dan Pelaksana Swakelola.</li>\n  <li><strong>Inklusi Pemerintah Desa & Badan Lain (Pasal 12 ayat 9-10):</strong> Pemerintah Desa, institusi di luar K/L/PD, BUMN/BUMD/BUMDes, kelompok masyarakat, hingga perorangan diberikan akses resmi untuk melaksanakan E-purchasing katalog dengan mengajukan permohonan akses pengguna kepada Pengelola Katalog.</li>\n</ul>\n\n<blockquote>“Dengan pembagian peran yang terukur antara Pejabat Pengadaan (&le; Rp200 juta), Pokja Pemilihan (Kompetisi > Rp200 juta), dan PPK (Pengendali Kontrak & HPS), Perlem LKPP 2/2026 meniadakan ruang abu-abu akuntabilitas dan memperkokoh benteng pencegahan fraud pengadaan.”</blockquote>\n\n<h2>8. Ketentuan Peralihan dan Masa Transisi</h2>\n<p>Pasal 22 dan Pasal 23 menetapkan jembatan penyesuaian hukum agar kegiatan operasional instansi tidak lumpuh:</p>\n<ol>\n  <li>Sistem Katalog Elektronik eksisting diberikan batas waktu penyesuaian arsitektur teknologi paling lambat <strong>1 (satu) tahun</strong> sejak tanggal pengundangan.</li>\n  <li>Dokumen penelaahan, kategori produk, dan pengumuman penayangan yang telah terbit berdasarkan Perlem 9/2021 dinyatakan tetap berlaku sepanjang belum digantikan atau bertentangan dengan Perlem baru.</li>\n  <li>Seluruh produk yang telah tayang tetap aktif di katalog.</li>\n  <li>E-purchasing yang tengah berjalan serta Surat/Bukti Pesanan yang telah ditandatangani sebelum 1 September 2026 tetap berlaku sah sampai dengan masa kontrak berakhir.</li>\n</ol>\n\n<h2>Referensi Regulasi</h2>\n<ul>\n  <li>Peraturan Lembaga Kebijakan Pengadaan Barang/Jasa Pemerintah Nomor 2 Tahun 2026 tentang Katalog Elektronik dalam Pengadaan Barang/Jasa Pemerintah (Berita Negara RI Tahun 2026 Nomor 608).</li>\n  <li>Peraturan Lembaga Kebijakan Pengadaan Barang/Jasa Pemerintah Nomor 9 Tahun 2021 tentang Toko Daring dan Katalog Elektronik dalam Pengadaan Barang/Jasa Pemerintah (Berita Negara RI Tahun 2021 Nomor 491) — <em>Dicabut dan Tidak Berlaku</em>.</li>\n  <li>Peraturan Presiden Nomor 16 Tahun 2018 tentang Pengadaan Barang/Jasa Pemerintah sebagaimana telah diubah terakhir dengan Peraturan Presiden Nomor 46 Tahun 2025.</li>\n</ul>\n\n<div style=\"margin-top: 30px; padding: 18px 20px; border-left: 4px solid #38bdf8; background-color: #1e293b; border-radius: 0 8px 8px 0;\"><strong style=\"color: #38bdf8; font-size: 1rem; display: block; margin-bottom: 6px;\">Tentang Penulis:</strong><p style=\"color: #cbd5e1; margin: 0; line-height: 1.6; font-size: 0.95rem;\"><strong style=\"color: #f1f5f9;\">Dr. Agung Mardhika, ST, MT</strong> adalah praktisi dan akademisi yang mendalami regulasi pengadaan barang/jasa pemerintah serta manajemen konstruksi infrastruktur.</p></div>",
  "author": "Dr. Agung Mardhika, ST, MT"
}];
